{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">


            <div class="card shadow-lg border-0 rounded-4">


                <div class="card-body p-5 text-center">


                    <div class="bg-primary text-white rounded-circle mx-auto mb-4
                                d-flex align-items-center justify-content-center"
                         style="width:90px;height:90px;">


                        <i class="bi bi-envelope-check fs-1"></i>


                    </div>



                    <h3 class="fw-bold text-primary mb-3">

                        Check Your Email

                    </h3>



                    <p class="text-muted fs-5">

                        We have sent you an email with instructions
                        to reset your password.

                    </p>



                    <div class="alert alert-info rounded-4 mt-4">

                        <i class="bi bi-info-circle"></i>

                        Please check your inbox and spam folder.

                    </div>



                    <a href="{% url 'account:login' %}"
                       class="btn btn-primary rounded-pill px-5 mt-3">

                        <i class="bi bi-box-arrow-in-right"></i>

                        Back to Login

                    </a>


                </div>


            </div>


        </div>


    </div>


</div>


{% endblock %}
