{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">


            <div class="card shadow-lg border-0 rounded-4">


                <div class="card-body p-5">


                    {% if validlink %}


                    <div class="text-center mb-4">


                        <div class="bg-warning text-dark rounded-circle mx-auto
                                    d-flex align-items-center justify-content-center"
                             style="width:85px;height:85px;">

                            <i class="bi bi-shield-lock fs-1"></i>

                        </div>


                        <h3 class="fw-bold text-primary mt-3">

                            Reset Password

                        </h3>


                        <p class="text-muted">

                            Enter your new password below.

                        </p>


                    </div>




                    <form method="post" novalidate>


                        {% csrf_token %}



                        <div class="mb-3">

                            {{ form.as_p }}

                        </div>




                        <button type="submit"
                                class="btn btn-success w-100 rounded-pill py-2 fw-bold shadow-sm">


                            <i class="bi bi-key"></i>

                            Change Password


                        </button>


                    </form>




                    {% else %}



                    <div class="text-center">


                        <div class="bg-danger text-white rounded-circle mx-auto mb-4
                                    d-flex align-items-center justify-content-center"
                             style="width:85px;height:85px;">


                            <i class="bi bi-x-lg fs-1"></i>


                        </div>



                        <h3 class="fw-bold text-danger">

                            Invalid Link

                        </h3>



                        <p class="text-muted">

                            This password reset link is not valid or has expired.

                        </p>



                    </div>



                    {% endif %}


                </div>


            </div>


        </div>


    </div>


</div>


{% endblock %}
