{% extends 'base.html' %}

{% block content %}

<div class="home-container">

    <!-- Search Center -->
    <div class="search-box">

        <form action="" method="get">

            {{ form.as_p }}

            <button type="submit">
                Search
            </button>

        </form>

    </div>


    <!-- Posts -->
    <div class="posts-wrapper">


        {% for post in posts %}

        <div class="post-card">


            <!-- Images -->
            <div class="post-images">

                {% for file in post.files.all %}

                    <img src="{{ file.file.url }}" alt="post image">

                {% endfor %}

            </div>


            <!-- Text -->
            <div class="post-text">

                <a href="{{ post.get_absolute_url }}">

                    {{ post.body|truncatewords:25 }}

                </a>

            </div>


        </div>


        {% empty %}

        <p>
            No posts found.
        </p>


        {% endfor %}


    </div>


</div>


{% endblock %}
